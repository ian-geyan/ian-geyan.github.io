# ---------------------------------------------------------------------------
# Site settings — edit these to personalize your site.
# Restart `bundle exec jekyll serve` after changing this file.
# ---------------------------------------------------------------------------

title: "Jane Researcher"
tagline: "PhD Candidate · Machine Learning & Systems"
email: your-email@example.com
description: >-
  Personal site of Jane Researcher — research, publications, projects,
  and CV.
baseurl: "" # subpath if not deploying to a root domain, e.g. "/my-repo"
url: "" # e.g. "https://username.github.io" — set before deploying

# Author / profile, shown on the home page and in the footer
author:
  name: "Jane Researcher"
  role: "PhD Candidate, Department of Computer Science, XYZ University"
  avatar: "/assets/images/avatar.jpg" # replace with your own photo
  location: "Singapore"
  bio: >-
    I work on <strong>[your research area]</strong>. I'm interested in
    connecting the dots between rigorous research and things that ship.
    This site collects my publications, projects, and CV.

# Social / contact links — leave a value blank ("") to hide that link
social:
  email: your-email@example.com
  github: your-github-username
  linkedin: your-linkedin-username
  scholar: "" # Google Scholar profile ID
  twitter: ""
  orcid: "" # ORCID iD, e.g. 0000-0000-0000-0000

# Nav bar, in order
nav:
  - title: Home
    url: /
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: CV
    url: /cv/
  - title: Blog
    url: /blog/
  - title: About
    url: /about/

# How many "selected" items to feature on the home page
home_publications_count: 3
home_projects_count: 3
home_news_count: 5

# Build settings
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - vendor/
