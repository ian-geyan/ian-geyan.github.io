# ---------------------------------------------------------------------------
# Site settings — edit these to personalize your site.
# Restart `bundle exec jekyll serve` after changing this file.
# ---------------------------------------------------------------------------

title: "Ge Yan"
tagline: "PhD Candidate"
email: geyan@u.nus.edu
description: >-
  Personal site of Ge Yan — research, publications, teaching,
  and CV.
baseurl: "" # subpath if not deploying to a root domain, e.g. "/my-repo"
url: "" # e.g. "https://username.github.io" — set before deploying

# Author / profile, shown on the home page and in the footer
author:
  name: "Ge Yan"
  role: "PhD Candidate, Electrical and Computer Engineering, National University of Singapore"
  avatar: "/assets/images/avatar.png" # replace with your own photo
  location: "Singapore"
  bio: >-
    I am a Ph.D. candidate at the National University of Singapore working at the intersection of wireless communications, signal processing, optimization, and computational electromagnetics. My research develops algorithms and mathematical models for wireless communication and sensing systems, with interests spanning reconfigurable MIMO, channel knowledge maps, radio sensing, inverse scattering, and machine learning. 
  # This site collects my publications, projects, and CV.
  # Shown as tags in the home page sidebar under "Research Interests"
  keywords:
    - Wireless Communication
    - Movable Antenna
    - Intelligent Reflecting Surfaces
    - Channel Knowledge Maps
    - Radio Sensing
    - Inverse Scattering
    - Machine Learning

# Social / contact links — leave a value blank ("") to hide that link.
# github/linkedin/scholar/twitter accept either a bare username/ID or a
# full profile URL (either works — pick whichever is easiest to copy/paste).
# email is a list — add more lines to show multiple addresses on the home
# page (each on its own line, under "E-mail(s):").
social:
  email:
    - geyan@u.nus.edu
    - ian.geyan.official@gmail.com
  github: ian-geyan
  linkedin: "https://linkedin.com/in/ge-yan-6817801a5"
  scholar: "https://scholar.google.com/citations?user=pKFOqfcAAAAJ&hl=en"
  twitter: ""
  orcid: "0000-0002-5109-9958" # ORCID iD, e.g. 0000-0000-0000-0000

# Nav bar, in order
nav:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: Teaching
    url: /teaching/
  - title: CV / Resume
    url: /cv/

# How many "selected" items to feature on the home page
home_publications_count: 3
home_research_count: 3
home_news_count: 5

# Show each publication's thumbnail (the `image:` field in
# _data/publications.yml). Set to false to hide the image column entirely
# and go back to the plain text-only publication list.
publications_show_images: false

# Build settings
permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules/
  - vendor/
