- title: "Practical Configuration for Intelligent Reflecting Surface (IRS)-Assisted Wireless Systems"
  period: "Oct. 2022 - Sep. 2025"
  description:
    - "Developed practical channel acquisition and quasi-static optimization methods for IRS-assisted wireless systems, enabling cost-efficient long-term coverage enhancement. "
    - "The proposed framework utilizes channel measurements available from existing wireless protocols without requiring additional signaling, facilitating seamless integration of IRSs into existing networks. "
  tags: ["Intelligent Reflecting Surfaces", "Coverage Enhancement", "Channel Estimation", "Optimization"]
