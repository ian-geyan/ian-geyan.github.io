- title: "Channel Knowledge Map (CKM) Modeling from An Electromagnetic Perspective"
  period: "Apr. 2026 - present"
  description:
    - "Developing an electromagnetic approach to CKM modeling and reconstruction as an alternative to conventional ray-tracing-based approaches, aiming to represent wireless channels in a physically consistent manner without requiring detailed geometric descriptions of the environment. "
    - "The approach aims to reduce the complexity and dimensionality of CKM modeling, with potential applications in wireless communication and sensing. "
