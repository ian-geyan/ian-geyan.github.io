- title: "Slow Movable Antenna (MA)-Aided Wireless Communications Based on Long-Term Channel Statistics"
  period: "Apr. 2024 - present"
  description:
    - "Proposed a novel design framework for MA-aided wireless communications based on long-term channel statistics instead of instantaneous channel, reducing the need for frequent channel acquisition and antenna repositioning and thereby facilitating practical deployment."
    - "By exploiting the covariance structure of user channels, the framework statistically mitigates inter-user channel correlation through antenna position optimization, improving multiuser communication performance over long timescales. "
  tags: ["Movable Antenna", "Statistical Channel State Information", "Multiuser Communications", "Optimization"]
  featured: false
